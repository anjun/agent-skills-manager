name: Release

# 本地：make release  /  make release VERSION=0.3.2
# 仅发布 macOS 通用包（Intel + Apple Silicon 二合一）

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（可不带 v，例如 0.3.1）"
        required: true
        type: string
      prerelease:
        description: "标记为 pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version / tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            RAW="${RAW#v}"
            TAG="v${RAW}"
            echo "version=${RAW}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            RAW="${TAG#v}"
            echo "version=${RAW}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create and push tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING="$(git rev-parse "$TAG")"
            HEAD="$(git rev-parse HEAD)"
            if [ "$EXISTING" != "$HEAD" ]; then
              echo "Error: tag $TAG already points to $EXISTING, HEAD is $HEAD" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build macOS universal zip (arm64 + amd64)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          for goarch in arm64 amd64; do
            echo "Building darwin/${goarch}"
            CGO_ENABLED=0 GOOS=darwin GOARCH="$goarch" go build \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "stage/asm-${goarch}" \
              ./cmd/agent-skills-manager
            chmod 755 "stage/asm-${goarch}"
          done

          cp scripts/Install.command stage/Install.command
          chmod 755 stage/Install.command
          cp scripts/README-macOS.txt stage/README.txt

          # zip 保留可执行位；单一安装包（Intel + Apple）
          (
            cd stage
            zip -9 -r "../dist/asm-macos.zip" \
              asm-arm64 asm-amd64 \
              Install.command \
              README.txt
          )
          (cd dist && shasum -a 256 asm-macos.zip > checksums.txt)
          ls -la dist stage
          unzip -l dist/asm-macos.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          body: |
            ## 安装（macOS 通用 · Intel + Apple 芯片）

            1. 下载 **`asm-macos.zip`**
            2. 双击解压
            3. 双击 **`Install.command`**（右键 → 打开 若被拦截）
            4. 新开终端：`asm version`

            已安装：`asm upgrade`
          files: |
            dist/asm-macos.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
