name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 仅测试，不打包、不发 Release。发版只由 Release workflow（tag / make release）触发。
      - name: Test
        run: go test ./...
